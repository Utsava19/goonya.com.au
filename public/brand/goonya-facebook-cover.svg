  <text x="410" y="148" text-anchor="middle" fill="url(#goGrad)" font-family="'Space Grotesk', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-5">GO</text>
  <text x="410" y="228" text-anchor="middle" fill="#f0eef5" font-family="'Space Grotesk', Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="-1.5">on ya</text>
  <text x="520" y="220" fill="#9b7cff" font-family="'Space Grotesk', Arial, sans-serif" font-size="58" font-weight="800">!</text>
