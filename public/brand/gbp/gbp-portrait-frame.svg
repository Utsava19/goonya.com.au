<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none" role="img" aria-label="Goonya team portrait frame">
  <rect width="1200" height="1200" fill="#0c0a14"/>
  <rect x="60" y="60" width="1080" height="1080" rx="48" fill="url(#bgGlow)" opacity="0.45"/>
  <rect x="100" y="100" width="1000" height="760" rx="32" fill="#141118" stroke="rgba(155,124,255,0.35)" stroke-width="4"/>
  <text x="600" y="470" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="'DM Sans', Arial, sans-serif" font-size="28" font-weight="600">TEAM PHOTO</text>
  <text x="600" y="520" text-anchor="middle" fill="rgba(155,124,255,0.55)" font-family="'Space Grotesk', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">REPLACE WITH YOUR PHOTO</text>
  <text x="600" y="980" text-anchor="middle" fill="url(#goGrad)" font-family="'Space Grotesk', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">NAME PLACEHOLDER</text>
  <text x="600" y="1040" text-anchor="middle" fill="#9b7cff" font-family="'DM Sans', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3">ROLE PLACEHOLDER</text>
  <text x="600" y="1120" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="'DM Sans', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2">GO ON YA - DIGITAL GROWTH FOR SMALL BUSINESS</text>
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.35" r="0.65">
      <stop stop-color="#9b7cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goGrad" x1="420" y1="920" x2="780" y2="990" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0ebff"/>
      <stop offset="0.55" stop-color="#9b7cff"/>
      <stop offset="1" stop-color="#6d4fd4"/>
    </linearGradient>
  </defs>
</svg>
